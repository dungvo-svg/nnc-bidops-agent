<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:Arial,sans-serif}</style><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B357A"/><stop offset="1" stop-color="#2387DA"/></linearGradient></defs><rect width="1600" height="1000" fill="#faf9f4"/><rect y="515" width="1600" height="485" fill="url(#blue)"/><path d="M1600 60 C1280 70 1070 200 1050 410 C1030 595 1250 725 1600 680" fill="none" stroke="#3a98d5" stroke-width="110" opacity=".32"/><text x="1540" y="65" font-size="34" font-weight="400" fill="#1565C0" text-anchor="end">Hộp 3 vỉ x 10 viên nén</text><text x="85" y="215" font-size="125" font-weight="700" fill="#1565C0" >Rosuvastatin</text><rect x="1190" y="115" width="300" height="145" rx="20" fill="#E8731A"/><text x="1340" y="219" font-size="86" font-weight="700" fill="#ffffff" text-anchor="middle">5 mg</text><text x="85" y="320" font-size="49" font-weight="400" fill="#142a46" >Mỗi viên nén chứa: Rosuvastatin 5 mg</text><text x="85" y="410" font-size="49" font-weight="400" fill="#142a46" >Viên nén · Uống</text><text x="85" y="465" font-size="32" font-weight="400" fill="#142a46" >Tablets · Oral use</text><text x="60" y="575" font-size="33" font-weight="400" fill="#ffffff" >Box of 3 blisters x 10 tablets</text><text x="60" y="655" font-size="37" font-weight="700" fill="#ffffff" >Cơ sở sản xuất: Lương Anh – Việt Nam</text><text x="60" y="720" font-size="29" font-weight="400" fill="#ffffff" >Chỉ định, chống chỉ định, cách dùng và các thông tin khác:</text><text x="60" y="760" font-size="29" font-weight="400" fill="#ffffff" >xem tờ hướng dẫn sử dụng</text><text x="60" y="815" font-size="29" font-weight="400" fill="#ffffff" >Đọc kỹ hướng dẫn sử dụng trước khi dùng</text><text x="60" y="860" font-size="29" font-weight="400" fill="#ffffff" >Để xa tầm tay trẻ em</text><text x="60" y="930" font-size="30" font-weight="700" fill="#ffffff" >Số lô SX:</text><text x="600" y="930" font-