<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><style>text{font-family:Arial,sans-serif}</style><rect width="1800" height="1000" fill="#f1f1ed"/><rect width="1800" height="60" fill="#1565C0"/><rect y="940" width="1800" height="60" fill="#1565C0"/><text x="70" y="160" font-size="68" font-weight="700" fill="#1555a2">Paracetamol 0,5 g</text><text x="70" y="265" font-size="45" font-weight="700" fill="#173357">Thành phần:</text><text x="70" y="325" font-size="43" fill="#173357">Mỗi viên nén chứa: Paracetamol 500 mg</text><text x="70" y="413" font-size="45" font-weight="700" fill="#173357">Dạng bào chế:</text><text x="70" y="473" font-size="43" fill="#173357">Viên nén · Uống</text><text x="70" y="560" font-size="45" font-weight="700" fill="#173357">Quy cách:</text><text x="70" y="620" font-size="43" fill="#173357">Hộp 50 vỉ x 10 viên nén</text><text x="70" y="680" font-size="39" fill="#173357">Box of 50 blisters x 10 tablets</text><text x="950" y="245" font-size="35" fill="#173357">Chỉ định, chống chỉ định, cách dùng</text><text x="950" y="300" font-size="35" fill="#173357">và các thông tin khác: xem tờ</text><text x="950" y="355" font-size="35" fill="#173357">hướng dẫn sử dụng</text><text x="950" y="450" font-size="35" fill="#173357">Đọc kỹ hướng dẫn sử dụng trước khi dùng</text><text x="950" y="530" font-size="35" fill="#173357">Để xa tầm tay trẻ em</text><text x="70" y="840" font-size="36" fill="#173357">Số lô SX:</text><text x="600" y="840" font-size="36" fill="#173357">NSX:</text><text x="1120" y="840" font-size="36" fill="#173357">HD:</text></svg>