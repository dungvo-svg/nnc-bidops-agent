<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750"><rect width="1600" height="750" fill="#FAFBFC"/><text x="65" y="105" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">Cơ sở sản xuất: Công ty CP Hóa –</text><text x="65" y="193" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">Dược phẩm Mekophar – Việt Nam</text><text x="65" y="281" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">Đọc kỹ hướng dẫn sử dụng</text><text x="65" y="369" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">trước khi dùng</text><text x="830" y="105" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">Chỉ định, chống chỉ định, cách dùng</text><text x="830" y="193" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">và các thông tin khác: xem tờ</text><text x="830" y="281" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">hướng dẫn sử dụng</text><text x="830" y="369" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#14558B">Để xa tầm tay trẻ em</text><line x1="60" y1="520" x2="1540" y2="520" stroke="#14558B" stroke-width="3"/><text x="65" y="640" font-family="Arial, sans-serif" font-size="52" font-weight="400" fill="#14558B">Số lô SX:</text><text x="660" y="640" font-family="Arial, sans-serif" font-size="52" font-weight="400" fill="#14558B">NSX:</text><text x="1210" y="640" font-family="Arial, sans-serif" font-size="52" font-weight="400" fill="#14558B">HD:</text></svg>