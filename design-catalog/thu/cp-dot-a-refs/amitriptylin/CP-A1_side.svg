<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2100" viewBox="0 0 1200 2100"><style>text{font-family:Arial,sans-serif}</style><rect width="1200" height="2100" fill="#f5f0e8"/><rect width="1200" height="90" fill="#95152a"/><rect y="1940" width="1200" height="160" fill="#95152a"/><text x="55" y="220" font-size="76" font-weight="700" fill="#971227" >Amitriptylin 25 mg</text><text x="55" y="350" font-size="64" font-weight="700" fill="#2a2526" >Thành phần:</text><text x="55" y="425" font-size="56" font-weight="400" fill="#2a2526" >Mỗi viên nén chứa:</text><text x="55" y="500" font-size="56" font-weight="400" fill="#2a2526" >Amitriptylin 25 mg</text><text x="55" y="620" font-size="64" font-weight="700" fill="#2a2526" >Dạng bào chế:</text><text x="55" y="700" font-size="56" font-weight="400" fill="#2a2526" >Viên nén · Uống</text><text x="55" y="825" font-size="64" font-weight="700" fill="#2a2526" >Quy cách:</text><text x="55" y="900" font-size="55" font-weight="400" fill="#2a2526" >Hộp 10 vỉ x 10 viên nén</text><text x="55" y="1040" font-size="50" font-weight="400" fill="#2a2526" >Box of 10 blisters x 10 tablets</text><text x="55" y="1230" font-size="52" font-weight="400" fill="#2a2526" >Chỉ định, chống chỉ định, cách dùng</text><text x="55" y="1300" font-size="52" font-weight="400" fill="#2a2526" >và các thông tin khác: xem tờ</text><text x="55" y="1370" font-size="52" font-weight="400" fill="#2a2526" >hướng dẫn sử dụng</text><text x="55" y="1480" font-size="52" font-weight="400" fill="#2a2526" >Đọc kỹ hướng dẫn sử dụng</text><text x="55" y="1550" font-size="52" font-weight="400" fill="#2a2526" >trước khi dùng</text><text x="55" y="1655" font-size="52" font-weight="400" fill="#2a2526" >Để xa tầm tay trẻ em</text><text x="55" y="1870" font-size="51" font-weight="700" fill="#2a2526" >Số lô SX:</text><text x="510" y="1870" font-size="51" font-weight="700" fill="#2a2526" >NSX:</text><text x="865" y="1870" font-size="51" font-weight="700" fill="#2a2526" >HD:</text></svg>